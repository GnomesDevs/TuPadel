spring.application.name=backend

# Conexión a MySQL: los valores salen de variables de entorno (las inyecta docker-compose).
# Los valores por defecto de URL y usuario permiten arrancar en local sin Docker.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tupadel}
spring.datasource.username=${DB_USER:tupadel}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo gestiona el script SQL del equipo, no Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# El ddl-auto=validate hace que al aarrancar, compruebe que tablas y columnas coinciden con las entidades JPA y falla si no