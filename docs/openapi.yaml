openapi: 3.0.3
info:
  title: TuPadel API
  version: 0.1.0
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      required: [id_usuario, nombre, apellido1, correo, dni, rol, activo, creado_en, actualizado_en]
      properties:
        id_usuario:
          type: integer
          format: int64
        nombre:
          type: string
          maxLength: 20
        apellido1:
          type: string
          maxLength: 20
        apellido2:
          type: string
          maxLength: 20
          nullable: true
        correo:
          type: string
          format: email
          maxLength: 254
        dni:
          type: string
          maxLength: 20
        rol:
          type: string
          enum: [CLIENTE, ADMIN_INSTALACION, SUPERADMIN]
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time

    Instalacion:
      type: object
      required: [id_instalacion, nombre, direccion, localidad, tipo_acceso, activa, creado_en, actualizado_en]
      properties:
        id_instalacion:
          type: integer
          format: int64
        nombre:
          type: string
          maxLength: 150
        descripcion:
          type: string
          nullable: true
        direccion:
          type: string
          maxLength: 255
        localidad:
          type: string
          maxLength: 100
        tipo_acceso:
          type: string
          enum: [PUBLICA, PRIVADA]
        codigo_acceso:
          type: string
          maxLength: 255
          nullable: true
        duracion_sesion_minutos:
          type: integer
          nullable: true
        activa:
          type: boolean
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time

    Pista:
      type: object
      required: [id_pista, id_instalacion, nombre, tipo, activa, creado_en]
      properties:
        id_pista:
          type: integer
          format: int64
        id_instalacion:
          type: integer
          format: int64
        nombre:
          type: string
          maxLength: 100
        tipo:
          type: string
          enum: [INDOOR, OUTDOOR]
        activa:
          type: boolean
        creado_en:
          type: string
          format: date-time

    UsuarioInstalacion:
      type: object
      required: [id_usuario, id_instalacion, asignado_por, asignado_en]
      properties:
        id_usuario:
          type: integer
          format: int64
        id_instalacion:
          type: integer
          format: int64
        asignado_por:
          type: integer
          format: int64
        asignado_en:
          type: string
          format: date-time

    FranjaHoraria:
      type: object
      required: [id_franja, id_pista, fecha, hora_inicio, hora_fin]
      properties:
        id_franja:
          type: integer
          format: int64
        id_pista:
          type: integer
          format: int64
        fecha:
          type: string
          format: date
        hora_inicio:
          type: string
          format: time
          example: "10:00:00"
        hora_fin:
          type: string
          format: time
          example: "11:30:00"

    Reserva:
      type: object
      required: [id_reserva, id_usuario, id_franja, estado, creada_en]
      properties:
        id_reserva:
          type: integer
          format: int64
        id_usuario:
          type: integer
          format: int64
        id_franja:
          type: integer
          format: int64
        estado:
          type: string
          enum: [CONFIRMADA, CANCELADA]
        creada_en:
          type: string
          format: date-time
        cancelada_en:
          type: string
          format: date-time
          nullable: true

paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Credenciales inválidas

  /auth/register:
    post:
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '201':
          description: Usuario creado exitosamente
        '400':
          description: Datos inválidos

  /instalaciones:
    get:
      summary: Obtener todas las instalaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de instalaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instalacion'
        '401':
          description: No autenticado

    post:
      summary: Crear una nueva instalación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instalacion'
      responses:
        '201':
          description: Instalación creada
        '400':
          description: Datos inválidos

  /instalaciones/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Obtener detalle de una instalación
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle de la instalación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instalacion'
        '404':
          description: Instalación no encontrada
    put:
      summary: Actualizar una instalación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instalacion'
      responses:
        '200':
          description: Instalación actualizada
    delete:
      summary: Eliminar una instalación
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Instalación eliminada

  /instalaciones/{id}/pistas:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Obtener todas las pistas de una instalación
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pistas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pista'
    post:
      summary: Añadir una pista a una instalación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pista'
      responses:
        '201':
          description: Pista creada

  /instalaciones/{id}/usuarios:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Asignar un usuario a una instalación (Tabla intermedia)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInstalacion'
      responses:
        '201':
          description: Asignación creada con éxito

  /pistas/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    put:
      summary: Actualizar una pista
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pista'
      responses:
        '200':
          description: Pista actualizada
    delete:
      summary: Eliminar una pista
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Pista eliminada

  /franjas:
    post:
      summary: Crear una nueva franja horaria para una pista
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FranjaHoraria'
      responses:
        '201':
          description: Franja horaria creada
        '400':
          description: Solapamiento de horarios o datos inválidos

  /reservas:
    post:
      summary: Crear una reserva de pista
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reserva'
      responses:
        '201':
          description: Reserva confirmada exitosamente
        '409':
          description: La franja ya está reservada