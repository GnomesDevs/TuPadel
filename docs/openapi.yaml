openapi: 3.0.3
info:
  title: TuPadel API
  version: 0.2.0
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ------------------
    # Esquemas de Base de Datos / Salida
    # ------------------
    Usuario:
      type: object
      required: [id_usuario, nombre, apellido1, correo, dni, rol, activo, creado_en, actualizado_en]
      properties:
        id_usuario:
          type: integer
          format: int64
          readOnly: true
        nombre:
          type: string
          maxLength: 20
        apellido1:
          type: string
          maxLength: 20
        apellido2:
          type: string
          maxLength: 20
          nullable: true
        correo:
          type: string
          format: email
          maxLength: 254
        dni:
          type: string
          maxLength: 20
        rol:
          type: string
          enum: [CLIENTE, ADMIN_INSTALACION, SUPERADMIN]
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true

    Instalacion:
      type: object
      required: [id_instalacion, nombre, direccion, localidad, tipo_acceso, activa, creado_en, actualizado_en]
      properties:
        id_instalacion:
          type: integer
          format: int64
          readOnly: true
        nombre:
          type: string
          maxLength: 150
        descripcion:
          type: string
          nullable: true
        direccion:
          type: string
          maxLength: 255
        localidad:
          type: string
          maxLength: 100
        tipo_acceso:
          type: string
          enum: [PUBLICA, PRIVADA]
        codigo_acceso:
          type: string
          maxLength: 255
          nullable: true
          writeOnly: true
        duracion_sesion_minutos:
          type: integer
          nullable: true
        activa:
          type: boolean
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true

    Pista:
      type: object
      required: [id_pista, id_instalacion, nombre, tipo, activa, creado_en]
      properties:
        id_pista:
          type: integer
          format: int64
          readOnly: true
        id_instalacion:
          type: integer
          format: int64
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        tipo:
          type: string
          enum: [INDOOR, OUTDOOR]
        activa:
          type: boolean
        creado_en:
          type: string
          format: date-time
          readOnly: true

    UsuarioInstalacion:
      type: object
      required: [id_usuario, id_instalacion, asignado_por, asignado_en]
      properties:
        id_usuario:
          type: integer
          format: int64
        id_instalacion:
          type: integer
          format: int64
        asignado_por:
          type: integer
          format: int64
        asignado_en:
          type: string
          format: date-time
          readOnly: true

    FranjaHoraria:
      type: object
      required: [id_franja, id_pista, fecha, hora_inicio, hora_fin]
      properties:
        id_franja:
          type: integer
          format: int64
          readOnly: true
        id_pista:
          type: integer
          format: int64
        fecha:
          type: string
          format: date
        hora_inicio:
          type: string
          format: time
          example: "10:00:00"
        hora_fin:
          type: string
          format: time
          example: "11:30:00"

    Reserva:
      type: object
      required: [id_reserva, id_usuario, id_franja, estado, creada_en]
      properties:
        id_reserva:
          type: integer
          format: int64
          readOnly: true
        id_usuario:
          type: integer
          format: int64
          readOnly: true
        id_franja:
          type: integer
          format: int64
        estado:
          type: string
          enum: [CONFIRMADA, CANCELADA]
          readOnly: true
        creada_en:
          type: string
          format: date-time
          readOnly: true
        cancelada_en:
          type: string
          format: date-time
          nullable: true

    # ------------------
    # Esquemas de Petición (Requests)
    # ------------------
    RegisterRequest:
      type: object
      required: [nombre, apellido1, correo, dni, password]
      properties:
        nombre:
          type: string
          maxLength: 20
        apellido1:
          type: string
          maxLength: 20
        apellido2:
          type: string
          maxLength: 20
          nullable: true
        correo:
          type: string
          format: email
          maxLength: 254
        dni:
          type: string
          maxLength: 20
        password:
          type: string
          minLength: 8
          maxLength: 72

    LoginRequest:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
        password:
          type: string

    CrearReservaRequest:
      type: object
      required: [id_franja]
      properties:
        id_franja:
          type: integer
          format: int64

    # ------------------
    # Esquemas Adicionales
    # ------------------
    UsuarioResumen:
      type: object
      required: [id_usuario, nombre, rol]
      properties:
        id_usuario:
          type: integer
          format: int64
        nombre:
          type: string
        rol:
          type: string
          enum: [CLIENTE, ADMIN_INSTALACION, SUPERADMIN]

    LoginResponse:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'

paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Cuerpo de la petición inválido
        '401':
          description: Credenciales inválidas

  /auth/register:
    post:
      summary: Registrar nuevo usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado exitosamente
        '400':
          description: Datos inválidos
        '409':
          description: Ya existe un usuario con ese correo o DNI

  /instalaciones:
    get:
      summary: Obtener todas las instalaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de instalaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instalacion'
        '401':
          description: No autenticado

    post:
      summary: Crear una nueva instalación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instalacion'
      responses:
        '201':
          description: Instalación creada
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administrador

  /instalaciones/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Obtener detalle de una instalación
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle de la instalación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instalacion'
        '401':
          description: No autenticado
        '404':
          description: Instalación no encontrada

    put:
      summary: Actualizar una instalación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instalacion'
      responses:
        '200':
          description: Instalación actualizada
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administrador
        '404':
          description: Instalación no encontrada

    delete:
      summary: Eliminar una instalación
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Instalación eliminada
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administrador
        '404':
          description: Instalación no encontrada

  /instalaciones/{id}/pistas:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Obtener todas las pistas de una instalación
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pistas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pista'
        '401':
          description: No autenticado
        '404':
          description: Instalación no encontrada

    post:
      summary: Añadir una pista a una instalación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pista'
      responses:
        '201':
          description: Pista creada
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administrador
        '404':
          description: Instalación no encontrada

  /instalaciones/{id}/usuarios:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Asignar un usuario a una instalación (Tabla intermedia)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInstalacion'
      responses:
        '201':
          description: Asignación creada con éxito
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administrador
        '404':
          description: Instalación no encontrada

  /pistas/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    put:
      summary: Actualizar una pista
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pista'
      responses:
        '200':
          description: Pista actualizada
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administrador
        '404':
          description: Pista no encontrada

    delete:
      summary: Eliminar una pista
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Pista eliminada
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administrador
        '404':
          description: Pista no encontrada

  /franjas:
    post:
      summary: Crear una nueva franja horaria para una pista
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FranjaHoraria'
      responses:
        '201':
          description: Franja horaria creada
        '400':
          description: Solapamiento de horarios o datos inválidos
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administrador

  /reservas:
    post:
      summary: Crear una reserva de pista
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva confirmada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          description: Petición inválida
        '401':
          description: No autenticado
        '404':
          description: La franja no existe
        '409':
          description: La franja ya está reservada