openapi: 3.0.3
info:
  title: TuPadel API
  version: 1.0.0
  description: Contrato de API REST para el MVP de TuPadel v1.0.0, basado en el esquema SQL de Rubén.

servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ------------------
    # Esquemas de Entidades (schema.sql)
    # ------------------
    Usuario:
      type: object
      required: [id_usuario, nombre, apellido1, correo, dni, rol, activo, creado_en, actualizado_en]
      properties:
        id_usuario:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nombre:
          type: string
          maxLength: 20
          example: "Juan"
        apellido1:
          type: string
          maxLength: 20
          example: "Pérez"
        apellido2:
          type: string
          maxLength: 20
          nullable: true
          example: "García"
        correo:
          type: string
          format: email
          maxLength: 254
          example: "juan.perez@example.com"
        dni:
          type: string
          maxLength: 20
          example: "12345678Z"
        rol:
          type: string
          enum: [CLIENTE, ADMIN_INSTALACION, SUPERADMIN]
          example: "CLIENTE"
        activo:
          type: boolean
          example: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-15T10:00:00Z"
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-15T10:00:00Z"

    Instalacion:
      type: object
      required: [id_instalacion, nombre, direccion, localidad, tipo_acceso, activa, creado_en, actualizado_en]
      properties:
        id_instalacion:
          type: integer
          format: int64
          readOnly: true
          example: 5
        nombre:
          type: string
          maxLength: 150
          example: "Club de Pádel Central"
        descripcion:
          type: string
          nullable: true
          example: "Instalación deportiva con 4 pistas de cristal."
        direccion:
          type: string
          maxLength: 255
          example: "Calle Mayor 12"
        localidad:
          type: string
          maxLength: 100
          example: "Castellón"
        tipo_acceso:
          type: string
          enum: [PUBLICA, PRIVADA]
          example: "PRIVADA"
        codigo_acceso:
          type: string
          maxLength: 255
          nullable: true
          writeOnly: true
          example: "FINCA2026"
        duracion_sesion_minutos:
          type: integer
          nullable: true
          example: 90
        activa:
          type: boolean
          example: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-01T08:00:00Z"
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-01T08:00:00Z"

    Pista:
      type: object
      required: [id_pista, id_instalacion, nombre, tipo, activa, creado_en]
      properties:
        id_pista:
          type: integer
          format: int64
          readOnly: true
          example: 12
        id_instalacion:
          type: integer
          format: int64
          example: 5
        nombre:
          type: string
          maxLength: 100
          example: "Pista 1 - Cristal"
        tipo:
          type: string
          enum: [INDOOR, OUTDOOR]
          example: "OUTDOOR"
        activa:
          type: boolean
          example: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-01T08:30:00Z"

    UsuarioInstalacion:
      type: object
      required: [id_usuario, id_instalacion, asignado_por, asignado_en]
      properties:
        id_usuario:
          type: integer
          format: int64
          example: 1
        id_instalacion:
          type: integer
          format: int64
          example: 5
        asignado_por:
          type: integer
          format: int64
          example: 2
        asignado_en:
          type: string
          format: date-time
          readOnly: true
          example: "2026-10-20T11:00:00Z"

    FranjaHoraria:
      type: object
      required: [id_franja, id_pista, fecha, hora_inicio, hora_fin]
      properties:
        id_franja:
          type: integer
          format: int64
          readOnly: true
          example: 101
        id_pista:
          type: integer
          format: int64
          example: 12
        fecha:
          type: string
          format: date
          example: "2026-11-10"
        hora_inicio:
          type: string
          example: "10:00:00"
        hora_fin:
          type: string
          example: "11:30:00"
        disponible:
          type: boolean
          description: Campo calculado en lecturas para conocer la disponibilidad.
          example: true

    Reserva:
      type: object
      required: [id_reserva, id_usuario, id_franja, estado, creada_en]
      properties:
        id_reserva:
          type: integer
          format: int64
          readOnly: true
          example: 501
        id_usuario:
          type: integer
          format: int64
          readOnly: true
          example: 1
        id_franja:
          type: integer
          format: int64
          example: 101
        estado:
          type: string
          enum: [CONFIRMADA, CANCELADA]
          readOnly: true
          example: "CONFIRMADA"
        creada_en:
          type: string
          format: date-time
          readOnly: true
          example: "2026-11-03T09:00:00Z"
        cancelada_en:
          type: string
          format: date-time
          nullable: true
          example: null

    # ------------------
    # Esquemas DTO (Peticiones / Respuestas)
    # ------------------
    RegisterRequest:
      type: object
      required: [nombre, apellido1, correo, dni, password]
      properties:
        nombre:
          type: string
          maxLength: 20
          example: "Juan"
        apellido1:
          type: string
          maxLength: 20
          example: "Pérez"
        apellido2:
          type: string
          maxLength: 20
          nullable: true
          example: "García"
        correo:
          type: string
          format: email
          maxLength: 254
          example: "juan.perez@example.com"
        dni:
          type: string
          maxLength: 20
          example: "12345678Z"
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: "SecretPass123"

    LoginRequest:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
          example: "juan.perez@example.com"
        password:
          type: string
          example: "SecretPass123"

    UsuarioResumen:
      type: object
      required: [id_usuario, nombre, rol]
      properties:
        id_usuario:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Juan"
        rol:
          type: string
          enum: [CLIENTE, ADMIN_INSTALACION, SUPERADMIN]
          example: "CLIENTE"

    LoginResponse:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'

    CrearReservaRequest:
      type: object
      required: [id_franja]
      properties:
        id_franja:
          type: integer
          format: int64
          example: 101

    ValidarCodigoRequest:
      type: object
      required: [codigo_acceso]
      properties:
        codigo_acceso:
          type: string
          example: "FINCA2026"

    ValidarCodigoResponse:
      type: object
      required: [valido, mensaje]
      properties:
        valido:
          type: boolean
          example: true
        mensaje:
          type: string
          example: "Código de acceso verificado correctamente"

    ErrorDetalle:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: integer
          example: 409
        mensaje:
          type: string
          example: "La franja horaria seleccionada ya se encuentra reservada."

paths:
  # ------------------
  # Autenticación
  # ------------------
  /auth/login:
    post:
      summary: Iniciar sesión
      description: "Acceso público. Retorna un JWT válido junto con la información resumida del usuario."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Petición incorrecta o datos faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '401':
          description: Credenciales inválidas

  /auth/register:
    post:
      summary: Registrar nuevo usuario
      description: "Acceso público. Permite el registro inicial de un usuario tipo CLIENTE."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente
        '400':
          description: Formato de datos no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '409':
          description: Conflicto - Ya existe un usuario con ese correo o DNI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'

  # ------------------
  # Instalaciones y Fincas Privadas
  # ------------------
  /instalaciones:
    get:
      summary: Obtener todas las instalaciones
      description: "Roles autorizados: CLIENTE, ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de instalaciones obtenida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instalacion'
        '401':
          description: Token no enviado o caducado

    post:
      summary: Crear una nueva instalación
      description: "Roles autorizados: SUPERADMIN."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instalacion'
      responses:
        '201':
          description: Instalación creada
        '400':
          description: Datos de instalación no válidos
        '401':
          description: No autenticado
        '403':
          description: No posee rol SUPERADMIN

  /instalaciones/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Obtener detalle de una instalación
      description: "Roles autorizados: CLIENTE, ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle de la instalación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instalacion'
        '401':
          description: No autenticado
        '404':
          description: Instalación no encontrada

    put:
      summary: Actualizar una instalación
      description: "Roles autorizados: ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instalacion'
      responses:
        '200':
          description: Instalación actualizada correctamente
        '400':
          description: Datos de entrada no válidos
        '401':
          description: No autenticado
        '403':
          description: Sin permisos para modificar la instalación
        '404':
          description: Instalación no encontrada

    delete:
      summary: Eliminar una instalación
      description: "Roles autorizados: SUPERADMIN."
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Instalación eliminada
        '401':
          description: No autenticado
        '403':
          description: Requiere permisos de SUPERADMIN
        '404':
          description: Instalación no encontrada

  /instalaciones/{id}/validar-codigo:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Validar código de acceso para recinto o finca privada
      description: "Roles autorizados: CLIENTE. Permite validar la clave de una instalación privada para poder visualizar o reservar sus pistas."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidarCodigoRequest'
      responses:
        '200':
          description: Verificación del código completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidarCodigoResponse'
        '400':
          description: Código de acceso incorrecto o no enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '401':
          description: No autenticado
        '404':
          description: Instalación no encontrada

  /instalaciones/{id}/pistas:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Obtener todas las pistas de una instalación
      description: "Roles autorizados: CLIENTE, ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pistas de la instalación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pista'
        '401':
          description: No autenticado
        '404':
          description: Instalación no encontrada

    post:
      summary: Añadir una pista a una instalación
      description: "Roles autorizados: ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pista'
      responses:
        '201':
          description: Pista creada
        '400':
          description: Datos de pista no válidos
        '401':
          description: No autenticado
        '403':
          description: Sin permisos de administración
        '404':
          description: Instalación no encontrada

  /instalaciones/{id}/usuarios:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Asignar un usuario gestor a una instalación
      description: "Roles autorizados: SUPERADMIN."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInstalacion'
      responses:
        '201':
          description: Asignación registrada con éxito
        '400':
          description: Petición inválida
        '401':
          description: No autenticado
        '403':
          description: Requiere rol SUPERADMIN
        '404':
          description: Instalación o Usuario no encontrado

  # ------------------
  # Pistas y Franjas Horarias
  # ------------------
  /pistas/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    put:
      summary: Actualizar una pista
      description: "Roles autorizados: ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pista'
      responses:
        '200':
          description: Pista actualizada
        '400':
          description: Datos inválidos
        '401':
          description: No autenticado
        '403':
          description: Sin permisos suficientes
        '404':
          description: Pista no encontrada

    delete:
      summary: Eliminar una pista
      description: "Roles autorizados: ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Pista eliminada
        '401':
          description: No autenticado
        '403':
          description: Sin permisos suficientes
        '404':
          description: Pista no encontrada

  /pistas/{id}/franjas:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: fecha
        required: true
        schema:
          type: string
          format: date
        example: "2026-11-10"
        description: Fecha de la consulta en formato YYYY-MM-DD.
    get:
      summary: Consultar la disponibilidad y franjas horarias de una pista
      description: "Roles autorizados: CLIENTE, ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de franjas horarias devuelta correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FranjaHoraria'
        '400':
          description: Parámetro de fecha con formato erróneo
        '401':
          description: No autenticado
        '404':
          description: Pista no encontrada

  /franjas:
    post:
      summary: Crear una franja horaria para una pista
      description: "Roles autorizados: ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FranjaHoraria'
      responses:
        '201':
          description: Franja horaria creada
        '400':
          description: Datos inválidos o incoherencia en las horas (hora_fin <= hora_inicio)
        '401':
          description: No autenticado
        '403':
          description: Sin permisos suficientes

  # ------------------
  # Reservas
  # ------------------
  /reservas:
    get:
      summary: Listar las reservas del usuario autenticado
      description: "Roles autorizados: CLIENTE. Retorna el historial propio de reservas."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de reservas propia del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
        '401':
          description: No autenticado

    post:
      summary: Crear una reserva de pista
      description: "Roles autorizados: CLIENTE. Asigna una franja disponible al usuario logueado."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaRequest'
      responses:
        '201':
          description: Reserva realizada y confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          description: Datos de la petición o id_franja no válidos
        '401':
          description: No autenticado
        '404':
          description: La franja horaria especificada no existe
        '409':
          description: Conflict - La franja ya está reservada por otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'

  /reservas/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Consultar una reserva por ID
      description: "Roles autorizados: CLIENTE (propietario de la reserva), ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Información detallada de la reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          description: No autenticado
        '403':
          description: La reserva pertenece a otro usuario
        '404':
          description: Reserva no encontrada

    delete:
      summary: Cancelar una reserva
      description: "Roles autorizados: CLIENTE (propietario de la reserva), ADMIN_INSTALACION, SUPERADMIN."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reserva cancelada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          description: No autenticado
        '403':
          description: No posee autorización para cancelar la reserva
        '404':
          description: Reserva no encontrada